<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101418"><title>ZIC United · 레이스 라이브</title><link rel="stylesheet" href="./style.css?v=scroll-5"></head><body>
<header><div class="brand">ZIC <b>UNITED</b></div><div class="session"><span id="class-label">HNF</span><strong id="session">경기 연결 중</strong></div><div class="head-right"><span id="connection" class="pill" role="status">연결 중</span><time id="clock">--:--:--</time><button id="fullscreen" title="전체 화면" aria-label="전체 화면">⛶</button></div></header>
<main><section class="map-panel" aria-labelledby="map-title"><div class="section-head"><h1 id="map-title">에버랜드 스피드웨이</h1><div class="map-tools"><button id="filter" aria-pressed="false">우리 팀만</button></div></div>
<div class="map-area"><canvas id="map" aria-label="실시간 차량 위치 지도"></canvas><div class="map-count"><strong id="car-count">—</strong><span>대 수신</span></div><div id="map-empty" role="status">위치 데이터 대기 중</div></div>
<div class="map-legend" aria-label="팀 차량 색상"><span><i style="background:#baff41"></i>21 강병휘</span><span><i style="background:#58caff"></i>55 신우진</span><span><i style="background:#ffb35b"></i>56 황용섭</span><span><i style="background:#c999ff"></i>85 윤성로</span><span class="other"><i></i>다른 차량</span></div>
<div class="map-footer"><span id="map-quality" title="GPS 시각을 기준으로 차량 위치를 보간합니다.">실시간 위치</span><a href="https://hnf.jp-race.com/live/map" target="_blank" rel="noopener">데이터 · JP-RACE ↗</a></div><div class="feed-note" id="feed-note">순위 데이터 대기 중</div></section>
<section class="team-panel" aria-labelledby="team-title"><div class="team-title"><h2 id="team-title">팀 차량 <small>N1</small></h2><button id="record-local" disabled>기록 시작</button><span id="team-status" role="status">연결 대기</span></div><div class="cards" id="cards"></div></section></main>
<footer><span id="record-status">연결 대기</span><span id="record-note" role="status"></span><span id="last-update">데이터 수신 대기</span></footer>
<script src="./leaderboard.js?v=map-rank-2"></script><script src="./engine.js?v=map-rank-2"></script><script src="./app.js?v=map-rank-2"></script></body></html>
