name: Refresh public race configuration
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/refresh-config.py
      - name: Commit changed public configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- config.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add config.json
            git commit -m "Refresh public race session configuration"
            git push
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
